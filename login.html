<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - كيان ستور</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #1a252f; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: #2c3e50; font-weight: 800; margin-bottom: 30px; }
        .btn-custom { background-color: #18bc9c; color: white; font-weight: 600; border-radius: 8px; padding: 12px; }
        .btn-custom:hover { background-color: #128f76; color: white;}
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-store fa-3x mb-3" style="color: #18bc9c;"></i>
        <h2>كيان ستور</h2>
        <div class="alert alert-danger" id="errorMsg" style="display: none; font-size: 14px;"></div>
        
        <form id="loginForm">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">اسم المستخدم</label>
                <input type="text" class="form-control form-control-lg" id="username" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label fw-bold">كلمة المرور</label>
                <input type="password" class="form-control form-control-lg" id="password" required>
            </div>
            <button type="submit" class="btn btn-custom w-100 fs-5" id="loginBtn">دخول <i class="fas fa-sign-in-alt"></i></button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // رابط جوجل سكريبت بتاعك
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFgQBh8uJ-RZNegq5hwqhqDJ3oAAjdNJOC79W0VnBVrfhROo5eyVAodiqXcWgo6PZe/exec";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            let btn = document.getElementById('loginBtn');
            let errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
            errorMsg.style.display = 'none';

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", username: user, password: pass })
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    // تنظيف البيانات وحفظها بشكل قاطع
                    localStorage.setItem('kayan_user', String(data.username).trim());
                    localStorage.setItem('kayan_role', String(data.role).trim());
                    localStorage.setItem('kayan_permissions', String(data.permissions || '').trim());
                    
                    // تحويل فوري من غير انتظار - السرعة أهم من مؤثر النجاح
                    window.location.replace("./index.html");
                } else {
                    errorMsg.innerText = data.message || "بيانات الدخول غير صحيحة";
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = 'دخول <i class="fas fa-sign-in-alt"></i>';
                }
            })
            .catch(err => {
                errorMsg.innerText = "حدث خطأ في الاتصال بالسيرفر، تأكد من الإنترنت.";
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'دخول <i class="fas fa-sign-in-alt"></i>';
            });
        });
    </script>
</body>
</html>
